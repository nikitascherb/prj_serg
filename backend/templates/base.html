<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>{% block title %}Панель управления{% endblock %} · Щербинины</title><style>*,*:before,*:after{box-sizing:border-box}body{margin:0;background:#100f0d;color:#eee4d6;font:14px/1.7 system-ui,-apple-system,sans-serif}a{color:#e7c28a}header{border-bottom:1px solid #453729;padding:17px 5%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header strong{letter-spacing:.12em}main{max-width:1200px;margin:auto;padding:45px 24px}h1{font:clamp(30px,4vw,46px)/1.3 Georgia,serif}h2{font:25px Georgia,serif}p{overflow-wrap:anywhere}.muted{color:#a79a88}.panel{border:1px solid #493b2c;border-radius:18px;background:#1b1814;padding:26px;margin:22px 0}input,select{background:#29231c;color:#f5ebde;border:1px solid #796346;border-radius:10px;padding:12px;max-width:100%;font:inherit}label{display:block;margin:15px 0}label input{display:block;width:100%}button{background:#c9a46b;color:#20180f;border:0;border-radius:10px;padding:12px 19px;cursor:pointer;font-weight:700}button:active{transform:translateY(2px)}button:focus-visible,a:focus-visible{outline:2px solid #ffe0a3;outline-offset:3px}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:660px}th,td{padding:13px 10px;text-align:left;border-bottom:1px solid #3d3328}th{color:#cbb08c;font-size:11px;letter-spacing:.08em}td{font-size:13px}.counts{display:flex;gap:12px;flex-wrap:wrap}.counts a{padding:12px 18px;border:1px solid #57442d;border-radius:12px;text-decoration:none}.message{white-space:pre-wrap;overflow-wrap:anywhere}.error{color:#f4b9a9}nav{display:flex;gap:15px;flex-wrap:wrap}@media(max-width:550px){main{padding:24px 15px}.panel{padding:18px}header{padding:15px}}</style></head><body><header><strong>ЩЕРБИНИНЫ · АДМИНИСТРИРОВАНИЕ</strong>{% if session.get('admin') %}<nav><a href="{{ url_for('admin_dashboard') }}">Заявки</a><form method="post" action="{{ url_for('admin_logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit">Выйти</button></form></nav>{% endif %}</header><main>{% block body %}{% endblock %}</main></body></html>
